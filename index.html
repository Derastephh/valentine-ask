<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="style.css" />
  <title>Asking Precious To Be My Valentine</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Aldrich&family=Pixelify+Sans:wght@400..700&display=swap"
    rel="stylesheet" />
  <title>Document</title>
</head>

<body>
  <!-- Envelope Screen (First) -->
  <div id="envelope-container">
    <img src="envelope.png" alt="Envelope" id="envelope" />
    <p>♡ Letter for You ♡</p>
  </div>

  <!-- Paper Note Screen (Second) -->
  <div id="note-container" style="display: none;">
    <div class="paper-note">
      <p class="note-greeting">Dear Precioussss,</p>
      <div class="note-content">
        <p id="note-message" class="note-text"></p>
      </div>
      <button id="continue-btn" class="continue-btn">More Love →</button>
    </div>
  </div>

  <!-- Letter Screen (Third - Question) -->
  <div id="letter-container" style="display: none;">
    <div class="letter-window">
      <h1 id="letter-title">Precious, Will you be my Valentine?💖</h1>

      <!-- Countdown until the Valentine date -->
      <div id="countdown" class="countdown" style="display: none"></div>

      <img src="cat_heart.gif" class="cat" id="letter-cat" />

      <div class="buttons" id="letter-buttons">
        <img src="yes.png" class="btn yes-btn" alt="Yes" />

        <div class="no-wrapper">
          <img src="no.png" class="btn no-btn" alt="No" />
        </div>
      </div>

      <p id="final-text" class="final-text" style="display: none">
        <strong>Valentine Date:</strong> Ann's Restaurant at 7pm. Dress fancy!
      </p>
    </div>
  </div>
  <script src="script.js"></script>
</body>

</html>
